name: Java CI with Maven and HTTPS (1БИБ23271)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Compile and Test)
        run: mvn clean compile test
        env:
          # Пароль для хранилища передается через секреты GitHub
          SSL_STORE_PASSWORD: ${{ secrets.SSL_STORE_PASSWORD }}

      - name: Package application
        run: mvn package -DskipTests
        env:
          SSL_STORE_PASSWORD: ${{ secrets.SSL_STORE_PASSWORD }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: vetclinic-app-1БИБ23271
          path: target/*.jar
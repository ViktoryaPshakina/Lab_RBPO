name: Java CI with Maven and HTTPS (1БИБ23271)

on:
  push:
    branches: [ "laba6" ]
  pull_request:
    branches: [ "laba6" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Запускаем базу данных PostgreSQL внутри GitHub Actions
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: vet_clinic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: your_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean compile test
        env:
          # Настройки базы для тестов (совпадают с сервисом выше)
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/vet_clinic_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: your_password
          # Пароль для SSL (берется из секретов GitHub или используется дефолтный)
          SSL_STORE_PASSWORD: ${{ secrets.SSL_STORE_PASSWORD || 'serverPass23271' }}

      - name: Package application
        run: mvn package -DskipTests
        env:
          SSL_STORE_PASSWORD: ${{ secrets.SSL_STORE_PASSWORD || 'serverPass23271' }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetclinic-app-1БИБ23271
          path: target/*.jar
# ==============================================================
server.port=8443
server.ssl.enabled=true
# ???????, ??? ???? studentServer.jks ????? ? src/main/resources/
server.ssl.key-store=classpath:studentServer.jks
server.ssl.key-store-type=JKS
server.ssl.key-store-password=${SSL_STORE_PASSWORD:serverPass23271}
